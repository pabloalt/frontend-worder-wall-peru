<div class="page-container">
  <div class="page-header">
    <h1 class="page-title"><mat-icon>list_alt</mat-icon> Gestión de Pedidos</h1>
    <button mat-raised-button color="primary" (click)="cargarPedidos()">
      <mat-icon>refresh</mat-icon> Actualizar
    </button>
  </div>

  <div *ngIf="loading()" class="loading-center">
    <mat-spinner></mat-spinner>
  </div>

  <mat-card *ngIf="!loading()">
    <mat-card-content>
      <div class="table-wrapper">
        <table mat-table [dataSource]="pedidos()" class="mat-elevation-z0">

          <!-- Cliente -->
          <ng-container matColumnDef="cliente">
            <th mat-header-cell *matHeaderCellDef>Cliente</th>
            <td mat-cell *matCellDef="let row">
              <div class="cliente-cell">
                <strong>{{ row.nombreCliente }}</strong>
                <small>{{ row.dni }}</small>
                <small>{{ row.celular }}</small>
              </div>
            </td>
          </ng-container>

          <!-- Fecha Boda -->
          <ng-container matColumnDef="fechaBoda">
            <th mat-header-cell *matHeaderCellDef>Fecha Boda</th>
            <td mat-cell *matCellDef="let row">
              {{ row.fechaBoda | date:'dd/MM/yyyy' }}
            </td>
          </ng-container>

          <!-- Estado -->
          <ng-container matColumnDef="estado">
            <th mat-header-cell *matHeaderCellDef>Estado</th>
            <td mat-cell *matCellDef="let row">
              <mat-select [value]="row.estado"
                          (selectionChange)="cambiarEstado(row, $event.value)"
                          class="estado-select">
                <mat-option *ngFor="let e of estados" [value]="e">{{ e }}</mat-option>
              </mat-select>
            </td>
          </ng-container>

          <!-- Detalles -->
          <ng-container matColumnDef="detalles">
            <th mat-header-cell *matHeaderCellDef>Tortas</th>
            <td mat-cell *matCellDef="let row">
              <div *ngFor="let d of row.detalles" class="detalle-mini">
                {{ d.tipoKeke }} - {{ d.porciones }} porciones
                <span *ngIf="d.esMaqueta" class="badge-maqueta">M</span>
              </div>
            </td>
          </ng-container>

          <!-- Contrato -->
          <ng-container matColumnDef="contrato">
            <th mat-header-cell *matHeaderCellDef>Contrato</th>
            <td mat-cell *matCellDef="let row">
              <a *ngIf="row.contratoPdfUrl"
                 [href]="row.contratoPdfUrl" target="_blank"
                 mat-icon-button color="primary"
                 matTooltip="Ver PDF">
                <mat-icon>picture_as_pdf</mat-icon>
              </a>
              <mat-icon *ngIf="!row.contratoPdfUrl" color="warn"
                        matTooltip="Sin contrato">cloud_off</mat-icon>
            </td>
          </ng-container>

          <!-- Acciones -->
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button *ngIf="row.email"
                      [matTooltip]="'Abrir correo a ' + row.email"
                      (click)="contactarEmail(row.email!)">
                <mat-icon>email</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <!-- Empty state -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell empty-row" [attr.colspan]="displayedColumns.length">
              <mat-icon>inbox</mat-icon> No hay pedidos registrados.
            </td>
          </tr>
        </table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
