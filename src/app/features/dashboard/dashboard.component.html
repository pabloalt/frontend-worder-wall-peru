<div class="page-container">
  <h1 class="page-title"><mat-icon>dashboard</mat-icon> Dashboard</h1>

  <div *ngIf="loading()" class="loading-center">
    <mat-spinner></mat-spinner>
  </div>

  <ng-container *ngIf="!loading()">
    <!-- Stats Cards -->
    <div class="stats-grid">
      <mat-card class="stat-card total">
        <mat-card-content>
          <mat-icon>assignment</mat-icon>
          <div class="stat-info">
            <span class="stat-number">{{ total() }}</span>
            <span class="stat-label">Total Pedidos</span>
          </div>
        </mat-card-content>
      </mat-card>

      <mat-card class="stat-card cotizado">
        <mat-card-content>
          <mat-icon>pending</mat-icon>
          <div class="stat-info">
            <span class="stat-number">{{ cotizados() }}</span>
            <span class="stat-label">Cotizados</span>
          </div>
        </mat-card-content>
      </mat-card>

      <mat-card class="stat-card pagado">
        <mat-card-content>
          <mat-icon>payments</mat-icon>
          <div class="stat-info">
            <span class="stat-number">{{ pagados() }}</span>
            <span class="stat-label">Pagados</span>
          </div>
        </mat-card-content>
      </mat-card>

      <mat-card class="stat-card entregado">
        <mat-card-content>
          <mat-icon>check_circle</mat-icon>
          <div class="stat-info">
            <span class="stat-number">{{ entregados() }}</span>
            <span class="stat-label">Entregados</span>
          </div>
        </mat-card-content>
      </mat-card>
    </div>

    <!-- Google Calendar -->
    <mat-card class="calendar-card">
      <mat-card-header>
        <mat-card-title>
          <mat-icon>calendar_month</mat-icon> Calendario de Bodas
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="calendar-wrapper">
          <iframe
            [src]="calendarUrl"
            class="google-calendar"
            frameborder="0"
            scrolling="no"
            title="Calendario de bodas">
          </iframe>
        </div>
      </mat-card-content>
    </mat-card>
  </ng-container>
</div>
